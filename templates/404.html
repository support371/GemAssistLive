{% extends "base.html" %}

{% block title %}Page Not Found - GemFeed{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="text-center">
            <i data-feather="search" width="48" height="48" class="text-muted mb-3"></i>
            <h1 class="h3 mb-3">Page Not Found</h1>
            <p class="text-muted mb-4">
                The page you're looking for doesn't exist.
            </p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                <i data-feather="home" width="16" height="16" class="me-1"></i>
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
